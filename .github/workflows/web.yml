name: web-ci

on:
  push:
    branches: [dev]
    paths:
      - "uhabits-web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [dev]
    paths:
      - "uhabits-web/**"
      - ".github/workflows/web.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: uhabits-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: uhabits-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
